                    const needs = Array.from(checked).map(cb => cb.value);
                    const injured = parseInt(document.getElementById('helpInjuredInput').value) || 0;
                    const reportData = {
                        type: 'help',
                        latitude: pos.latitude,
                        longitude: pos.longitude,
                        municipality: location,
                        needs: needs,
                        injured_count: hasInjured ? injured : 0,
                        in_danger: inDanger,
                        description: `Necesita: ${needs.join(', ')}`
                    };
                    const report = await reports.createReport(reportData);
                    if (selectedFile && report) {
                        const imageUrl = await uploadImage(selectedFile, report.id);
                        if (imageUrl) {
                            await supabaseClient.from('reports').update({ image_url: imageUrl }).eq('id', report.id);
                        }
                    }
                    closeModal();
                    setTimeout(() => reports.syncPendingReports(), 2000);
                } catch (error) {
                    showToast('📍 ' + error.message, 'warning');
                    mapManager.showLocationPicker();
                    closeModal();
                }
            });
        }

        // --- Damage Modal ---
        function showDamageModal() {
            const types = ['Vivienda', 'Edificio', 'Escuela', 'Hospital', 'Comercio', 'Puente', 'Carretera', 'Poste',
                'Red eléctrica', 'Acueducto', 'Otro'
            ];
            const levels = ['Sin daño visible', 'Daño leve', 'Daño importante', 'Daño grave', 'Colapso'];
            openModal(`
                <div class="modal-title">🏚️ REPORTAR DAÑO</div>
                <div class="modal-form-group">
                    <label>Tipo de afectación</label>
                    <div class="grid-options" id="damageTypes">
                        ${types.map(t => `<label><input type="checkbox" value="${t}"> ${t}</label>`).join('')}
                    </div>
                </div>
                <div class="modal-form-group">
                    <label>Nivel aparente</label>
                    <div class="grid-options" style="grid-template-columns:1fr 1fr;">
                        ${levels.map((l,i) => `<button class="btn-secondary" data-level="${i}" style="margin:0;padding:10px;font-size:0.85rem;">${l}</button>`).join('')}
                    </div>
                    <div style="margin-top:6px;color:#e74c3c;font-size:0.7rem;font-weight:600;">⚠️ Este reporte no es evaluación técnica estructural</div>
                </div>
                <div class="modal-form-group">
                    <label>Foto (opcional)</label>
                    <input type="file" id="damagePhoto" accept="image/*" style="padding:10px;border:2px dashed rgba(255,255,255,0.15);border-radius:12px;background:transparent;width:100%;color:white;">
                </div>
                <button class="btn-primary warning" id="damagePublishBtn">📤 PUBLICAR</button>
            `);

            let selectedLevel = null,
                selectedFile = null;
            document.querySelectorAll('[data-level]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('[data-level]').forEach(b => { b.style.background = '';
                        b.style.color = ''; });
                    btn.style.background = '#f39c12';
                    btn.style.color = 'white';
                    selectedLevel = parseInt(btn.dataset.level);
                });
            });
            document.getElementById('damagePhoto').addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) selectedFile = e.target.files[0];
            });

            document.getElementById('damagePublishBtn').addEventListener('click', async () => {
                try {
                    const checked = document.querySelectorAll('#damageTypes input:checked');
                    if (checked.length === 0) {
                        showToast('Selecciona al menos un tipo', 'warning');
                        return;
                    }
                    if (selectedLevel === null) {
                        showToast('Selecciona un nivel de daño', 'warning');
                        return;
                    }
                    let pos = await geolocation.getCurrentPosition();
                    const location = await geolocation.getLocationName(pos.latitude, pos.longitude);
                    const types = Array.from(checked).map(cb => cb.value);
                    const levelsList = ['sin_daño', 'daño_leve', 'daño_importante', 'daño_grave', 'colapso'];
                    const reportData = {
                        type: 'damage',
                        latitude: pos.latitude,
                        longitude: pos.longitude,
                        municipality: location,
                        damage_types: types,
                        damage_level: levelsList[selectedLevel],
                        description: `${types.join(', ')} - ${levelsList[selectedLevel]}`
                    };
                    const report = await reports.createReport(reportData);
                    if (selectedFile && report) {
                        const imageUrl = await uploadImage(selectedFile, report.id);
                        if (imageUrl) {
                            await supabaseClient.from('reports').update({ image_url: imageUrl }).eq('id', report.id);
                        }
                    }
                    closeModal();
                    setTimeout(() => reports.syncPendingReports(), 2000);
                } catch (error) {
                    showToast('📍 ' + error.message, 'warning');
                    mapManager.showLocationPicker();
                    closeModal();
                }
            });
        }

        // --- Road Modal V2 - CON IDENTIFICACIÓN DE VÍA ---
        function showRoadModal() {
            const statuses = ['Vía libre', 'Tránsito parcial', 'Vía bloqueada', 'Derrumbe', 'Puente afectado',
                'Inundación', 'Árbol/objeto bloqueando', 'Otro'
            ];
            openModal(`
                <div class="modal-title">🚧 REPORTAR VÍA</div>
                <div style="text-align:center;margin-bottom:14px;">
                    <p style="color:var(--color-text);font-size:0.85rem;">
                        Reporta el estado de una vía para ayudar a la comunidad
                    </p>
                </div>
                <div class="modal-form-group">
                    <label>🛣️ Nombre de la vía (obligatorio)</label>
                    <input type="text" id="roadName" placeholder="Ej: Carrera 7, Autopista Norte, Vía Bogotá - Medellín" required>
                </div>
                <div class="modal-form-group">
                    <label>Estado de la vía</label>
                    <div class="grid-options" id="roadTypes">
                        ${statuses.map(s => `<label><input type="checkbox" value="${s}"> ${s}</label>`).join('')}
                    </div>
                </div>
                <div class="modal-form-group">
                    <label>Ubicación aproximada (opcional)</label>
                    <input type="text" id="roadLocation" placeholder="Ej: Km 12, cerca de ..." />
                </div>
                <div class="modal-form-group">
                    <label>Foto (opcional)</label>
                    <input type="file" id="roadPhoto" accept="image/*" style="padding:10px;border:2px dashed rgba(255,255,255,0.15);border-radius:12px;background:transparent;width:100%;color:white;">
                </div>
                <button class="btn-primary info" id="roadPublishBtn">📤 PUBLICAR</button>
            `);

            let selectedFile = null;
            document.getElementById('roadPhoto').addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) selectedFile = e.target.files[0];
            });

            document.getElementById('roadPublishBtn').addEventListener('click', async () => {
                try {
                    const roadName = document.getElementById('roadName').value.trim();
                    if (!roadName) {
                        showToast('Por favor, escribe el nombre de la vía', 'warning');
                        return;
                    }

                    const checked = document.querySelectorAll('#roadTypes input:checked');
                    if (checked.length === 0) {
                        showToast('Selecciona al menos un estado', 'warning');
                        return;
                    }

                    let pos = await geolocation.getCurrentPosition();
                    const location = await geolocation.getLocationName(pos.latitude, pos.longitude);
                    const roadLocation = document.getElementById('roadLocation').value;

                    const reportData = {
                        type: 'road',
                        latitude: pos.latitude,
                        longitude: pos.longitude,
                        municipality: location,
                        road_name: roadName,
                        road_status: Array.from(checked).map(cb => cb.value),
                        location_detail: roadLocation,
                        description: `${roadName}: ${Array.from(checked).map(cb => cb.value).join(', ')}${roadLocation ? ' en ' + roadLocation : ''}`
                    };

                    const report = await reports.createReport(reportData);
                    if (selectedFile && report) {
                        const imageUrl = await uploadImage(selectedFile, report.id);
                        if (imageUrl) {
                            await supabaseClient.from('reports').update({ image_url: imageUrl }).eq('id', report.id);
                        }
                    }
                    closeModal();
                    setTimeout(() => reports.syncPendingReports(), 2000);
                } catch (error) {
                    showToast('📍 ' + error.message, 'warning');
                    mapManager.showLocationPicker();
                    closeModal();
                }
            });
        }

        // --- Resources Modal V2 - CON GESTIÓN DE AYUDAS ---
        function showResourcesModal() {
            // Contar puntos de acopio por ciudad
            const cities = {};
            OFFICIAL_COLLECTION_POINTS.forEach(p => {
                cities[p.city] = (cities[p.city] || 0) + 1;
            });

            // Estado de ayudas (simulado con datos reales)
            const aidStats = {
                total: OFFICIAL_COLLECTION_POINTS.length,
                oficiales: OFFICIAL_COLLECTION_POINTS.filter(p => p.type === 'oficial').length,
                ciudades: Object.keys(cities).length
            };

            openModal(`
                <div class="modal-title">📍 RECURSOS Y AYUDAS</div>

                <div class="aid-stats">
                    <div class="aid-stat">
                        <div class="number">${aidStats.total}</div>
                        <div class="label">Puntos de acopio</div>
                    </div>
                    <div class="aid-stat">
                        <div class="number">${aidStats.oficiales}</div>
                        <div class="label">Oficiales verificados</div>
                    </div>
                    <div class="aid-stat">
                        <div class="number">${aidStats.ciudades}</div>
                        <div class="label">Ciudades</div>
                    </div>
                </div>

                <div class="tabs-container">
                    <button class="tab-btn active" data-tab="tab-puntos">🏛️ Puntos de acopio</button>
                    <button class="tab-btn" data-tab="tab-ayudas">📦 Necesidades</button>
                </div>

                <div id="tab-puntos" class="tab-content active">
                    <div style="font-size:0.75rem;color:var(--color-text);margin-bottom:8px;">
                        ${aidStats.total} puntos de acopio oficiales verificados
                    </div>
                    <div id="resourcesList" style="max-height:300px;overflow-y:auto;">
                        ${OFFICIAL_COLLECTION_POINTS.map(p => `
                            <div class="resource-item" onclick="showCollectionPointDetail('${p.id}')">
                                <span class="icon">🏛️</span>
                                <div class="info">
                                    <div class="name">${p.name}</div>
                                    <div class="detail">${p.city} • ${p.organization}</div>
                                </div>
                                <span class="badge badge-oficial">OFICIAL</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div id="tab-ayudas" class="tab-content">
                    <div style="font-size:0.85rem;color:var(--color-text);margin-bottom:10px;text-align:center;">
                        📦 Lo que se necesita en los puntos de acopio
                    </div>
                    <div style="background:rgba(255,255,255,0.04);border-radius:12px;padding:12px;max-height:300px;overflow-y:auto;">
                        <div style="font-weight:700;font-size:0.8rem;margin-bottom:6px;color:#2ecc71;">✅ Alimentos no perecederos:</div>
                        <div style="font-size:0.75rem;color:var(--color-text);padding-left:12px;">
                            Arroz, aceite, pastas, enlatados, granos (fríjol, lentejas), harina, panela, leche en polvo, chocolate, avena
                        </div>
                        <div style="font-weight:700;font-size:0.8rem;margin:8px 0 4px 0;color:#2ecc71;">✅ Agua e hidratación:</div>
                        <div style="font-size:0.75rem;color:var(--color-text);padding-left:12px;">
                            Agua potable embotellada, bebidas hidratantes
                        </div>
                        <div style="font-weight:700;font-size:0.8rem;margin:8px 0 4px 0;color:#2ecc71;">✅ Elementos de albergue:</div>
                        <div style="font-size:0.75rem;color:var(--color-text);padding-left:12px;">
                            Colchonetas, frazadas, cobijas, mantas, almohadas, toldillos, sábanas
                        </div>
                        <div style="font-weight:700;font-size:0.8rem;margin:8px 0 4px 0;color:#2ecc71;">✅ Higiene y aseo:</div>
                        <div style="font-size:0.75rem;color:var(--color-text);padding-left:12px;">
                            Jabón, champú, cepillos dentales, crema dental, toallas higiénicas, papel higiénico, pañales, toallitas húmedas
                        </div>
                        <div style="font-weight:700;font-size:0.8rem;margin:8px 0 4px 0;color:#2ecc71;">✅ Primeros auxilios:</div>
                        <div style="font-size:0.75rem;color:var(--color-text);padding-left:12px;">
                            Tapabocas, gasas estériles, alcohol, clorhexidina, guantes quirúrgicos, vendajes
                        </div>
                        <div style="font-weight:700;font-size:0.8rem;margin:8px 0 4px 0;color:#f39c12;">⚠️ NO se reciben:</div>
                        <div style="font-size:0.75rem;color:var(--color-text);padding-left:12px;">
                            Medicamentos, ropa usada, elementos usados, alimentos perecederos, productos vencidos
                        </div>
                        <div style="margin-top:12px;padding:10px;background:rgba(255,255,255,0.04);border-radius:8px;font-size:0.65rem;color:var(--color-text);text-align:center;">
                            ℹ️ Datos verificados desde fuentes oficiales: Cruz Roja, Alcaldías y UNGRD
                        </div>
                    </div>
                </div>

                <button class="btn-secondary" onclick="closeModal()" style="margin-top:10px;">Cerrar</button>
            `);

            // Tabs
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(btn.dataset.tab).classList.add('active');
                });
            });
        }

        // ============================================================
        // ACTUALIZAR PANEL DE SITUACIÓN
        // ============================================================
        function updateSituationPanel(reports) {
            const safe = reports.filter(r => r.type === 'safe').length;
            const help = reports.filter(r => r.type === 'help').length;
            const damage = reports.filter(r => r.type === 'damage').length;
            const roads = reports.filter(r => r.type === 'road').length;

            document.getElementById('situSafe').textContent = safe;
            document.getElementById('situHelp').textContent = help;
            document.getElementById('situDamage').textContent = damage;
            document.getElementById('situRoads').textContent = roads;
            document.getElementById('situTime').textContent = new Date().toLocaleTimeString([], { hour: '2-digit',
                minute: '2-digit' });
        }

        // ============================================================
        // CORROBORAR (global)
        // ============================================================
        window.corroborateReport = async function(reportId) {
            if (!reports.authReady) {
                showToast('⏳ Esperando autenticación...', 'warning');
                return;
            }
            await reports.corroborateReport(reportId);
        };

        // ============================================================
        // INICIALIZACIÓN
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🔗 Conectando botones V2...');

            document.getElementById('safeBtn').addEventListener('click', showSafeModal);
            document.getElementById('helpBtn').addEventListener('click', showHelpModal);
            document.getElementById('damageBtn').addEventListener('click', showDamageModal);
            document.getElementById('roadBtn').addEventListener('click', showRoadModal);
            document.getElementById('resourcesBtn').addEventListener('click', showResourcesModal);

            document.getElementById('myLocationBtn').addEventListener('click', () => mapManager.centerOnUser());
            document.getElementById('zoomInBtn').addEventListener('click', () => {
                if (mapManager.map) mapManager.map.zoomIn();
            });
            document.getElementById('zoomOutBtn').addEventListener('click', () => {
                if (mapManager.map) mapManager.map.zoomOut();
            });

            document.getElementById('emergencyModeBtn').addEventListener('click', () => {
                document.getElementById('app').classList.toggle('emergency-mode');
                showToast(
                    document.getElementById('app').classList.contains('emergency-mode') ?
                    '🚨 MODO EMERGENCIA' : 'Modo normal',
                    'info'
                );
            });
            document.getElementById('lowDataBtn').addEventListener('click', () => {
                document.getElementById('app').classList.toggle('low-data-mode');
                showToast(
                    document.getElementById('app').classList.contains('low-data-mode') ?
                    '📶 BAJO CONSUMO' : 'Modo normal',
                    'info'
                );
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === '1') document.getElementById('safeBtn').click();
                if (e.key === '2') document.getElementById('helpBtn').click();
                if (e.key === '3') document.getElementById('damageBtn').click();
                if (e.key === '4') document.getElementById('roadBtn').click();
                if (e.key === '5') document.getElementById('resourcesBtn').click();
            });

            init();
        });

        async function init() {
            console.log('🗺️ Iniciando Mapa Vivo Colombia V2');
            console.log('📡 Conectado a Supabase:', CONFIG.supabaseUrl);
            console.log(`📍 ${OFFICIAL_COLLECTION_POINTS.length} puntos de acopio oficiales cargados`);

            await reports.initAuth();
            mapManager.init('map');

            try {
                const pos = await geolocation.getCurrentPosition();
                if (pos) {
                    mapManager.goToLocation(pos.latitude, pos.longitude, 12);
                }
            } catch (e) {
                console.warn('📍 Ubicación no disponible:', e.message);
                showToast('📍 No se pudo obtener tu ubicación automáticamente.', 'warning');
                setTimeout(() => mapManager.showLocationPicker(), 1000);
            }

            setTimeout(() => fetchEarthquakes(), 2000);
            await reports.loadReports();
            reports.subscribeToRealtime();
            setTimeout(() => reports.syncPendingReports(), 3000);

            // Ya no necesitamos initResources() porque los puntos de acopio están en el código

            window.addEventListener('offline', () => {
                document.getElementById('connectionStatus').className = 'connection-status offline';
                document.getElementById('connectionStatus').querySelector('.status-text').textContent = 'Sin conexión';
                document.getElementById('offline-indicator').classList.remove('hidden');
                offline.updatePendingCount();
            });
            window.addEventListener('online', () => {
                document.getElementById('connectionStatus').className = 'connection-status online';
                document.getElementById('connectionStatus').querySelector('.status-text').textContent = 'Conectado';
                document.getElementById('offline-indicator').classList.add('hidden');
                reports.syncPendingReports();
            });

            setInterval(() => {
                if (navigator.onLine && reports.authReady) reports.syncPendingReports();
            }, 30000);

            console.log('✅ Aplicación V2 lista');
            console.log(`👤 Usuario autenticado: ${reports.authReady}`);
        }

        // Exponer globales
        window.mapManager = mapManager;
        window.closeModal = closeModal;
        window.showToast = showToast;
        window.showCollectionPointDetail = showCollectionPointDetail;
    </script>
</body>
</html>
