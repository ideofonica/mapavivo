<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mapa Vivo Colombia</title>
    <meta name="description" content="Herramienta comunitaria para emergencias sísmicas en Colombia" />
    <meta name="theme-color" content="#1a3c6e" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.5.1/dist/maplibre-gl.css" />
    <style>
        /* ===== ESTILOS COMPLETOS ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --color-primary: #1a3c6e;
            --color-success: #2ecc71;
            --color-danger: #e74c3c;
            --color-warning: #f39c12;
            --color-info: #3498db;
            --color-dark: #2c3e50;
            --color-light: #ecf0f1;
            --color-white: #ffffff;
            --color-gray: #95a5a6;
            --shadow: 0 2px 10px rgba(0,0,0,0.15);
            --radius: 12px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: var(--font-family);
            background: var(--color-light);
            color: var(--color-dark);
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            position: fixed;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: relative;
            background: var(--color-light);
        }
        #header {
            background: var(--color-primary);
            color: var(--color-white);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 100;
            min-height: 52px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .header-content {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            flex-wrap: wrap;
        }
        #header h1 { font-size: 1.1rem; font-weight: 700; margin: 0; }
        .header-subtitle { font-size: 0.65rem; opacity: 0.8; letter-spacing: 1px; }
        .header-actions { display: flex; gap: 4px; }
        .header-actions button {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            min-width: 36px;
            min-height: 36px;
        }
        #connectionStatus {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.65rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            flex-shrink: 0;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .connection-status.online .status-dot { background: var(--color-success); }
        .connection-status.offline .status-dot { background: var(--color-danger); }
        .sync-status {
            font-size: 0.55rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(255,255,255,0.15);
            margin-left: 4px;
            white-space: nowrap;
        }
        .sync-status.pending { background: var(--color-warning); color: #2c3e50; }
        .sync-status.synced { background: var(--color-success); color: white; }
        .sync-status.error { background: var(--color-danger); color: white; }
        .sync-status.offline { background: var(--color-gray); color: white; }
        #main-content {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #map-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #map-controls {
            position: absolute;
            right: 12px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
        }
        .map-control-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: var(--color-white);
            box-shadow: var(--shadow);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .map-control-btn#myLocationBtn {
            background: var(--color-primary);
            color: white;
        }
        #quick-actions {
            position: absolute;
            bottom: 16px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 0 8px;
            z-index: 20;
            flex-wrap: wrap;
        }
        .quick-action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            border: none;
            border-radius: var(--radius);
            background: var(--color-white);
            box-shadow: var(--shadow);
            cursor: pointer;
            min-width: 60px;
            min-height: 56px;
            flex: 1;
            max-width: 80px;
            transition: transform 0.1s;
        }
        .quick-action-btn:active { transform: scale(0.95); }
        .quick-action-btn .btn-icon { font-size: 1.4rem; }
        .quick-action-btn .btn-label {
            font-size: 0.55rem;
            font-weight: 600;
            text-align: center;
            margin-top: 2px;
            color: var(--color-dark);
        }
        .quick-action-btn.safe-btn { background: var(--color-success); color: white; }
        .quick-action-btn.safe-btn .btn-label { color: white; }
        .quick-action-btn.help-btn { background: var(--color-danger); color: white; }
        .quick-action-btn.help-btn .btn-label { color: white; }
        .quick-action-btn.damage-btn { background: var(--color-warning); color: white; }
        .quick-action-btn.damage-btn .btn-label { color: white; }
        .quick-action-btn.road-btn { background: var(--color-info); color: white; }
        .quick-action-btn.road-btn .btn-label { color: white; }
        .quick-action-btn.resources-btn { background: var(--color-primary); color: white; }
        .quick-action-btn.resources-btn .btn-label { color: white; }
        #stats-panel {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 15;
        }
        .stats-toggle {
            background: rgba(255,255,255,0.95);
            border: none;
            border-radius: 20px;
            padding: 6px 12px;
            box-shadow: var(--shadow);
            cursor: pointer;
            font-size: 0.75rem;
        }
        .stats-content {
            background: rgba(255,255,255,0.97);
            border-radius: var(--radius);
            padding: 12px;
            margin-top: 6px;
            box-shadow: var(--shadow);
            min-width: 140px;
        }
        .stats-content.hidden { display: none; }
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.7rem;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .stat-value {
            font-weight: 700;
            color: var(--color-primary);
            font-size: 0.85rem;
        }
        #offline-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 16px 24px;
            border-radius: var(--radius);
            text-align: center;
            z-index: 50;
            font-weight: 500;
            backdrop-filter: blur(8px);
        }
        #offline-indicator span {
            display: block;
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 4px;
        }
        #offline-indicator.hidden { display: none; }
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            backdrop-filter: blur(4px);
        }
        #modal-overlay.hidden { display: none; }
        #modal-container {
            background: var(--color-white);
            border-radius: var(--radius);
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            position: relative;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            font-size: 1.4rem;
            color: var(--color-gray);
            cursor: pointer;
        }
        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 16px;
            text-align: center;
        }
        .modal-form-group { margin-bottom: 14px; }
        .modal-form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .modal-form-group input,
        .modal-form-group select,
        .modal-form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
        }
        .modal-form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .modal-form-group input:focus,
        .modal-form-group textarea:focus {
            outline: none;
            border-color: var(--color-primary);
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            background: var(--color-primary);
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary.success { background: var(--color-success); }
        .btn-primary.danger { background: var(--color-danger); }
        .btn-primary.warning { background: var(--color-warning); }
        .btn-secondary {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--color-gray);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-dark);
            background: transparent;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-secondary:active { background: var(--color-light); }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            padding: 6px 12px;
            background: var(--color-light);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .checkbox-group label:has(input:checked) {
            background: var(--color-primary);
            color: white;
        }
        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--color-primary);
        }
        #toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            z-index: 2000;
            max-width: 90%;
            text-align: center;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        #toast.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(10px);
            pointer-events: none;
        }
        #toast.success { border-left: 4px solid var(--color-success); }
        #toast.error { border-left: 4px solid var(--color-danger); }
        #toast.warning { border-left: 4px solid var(--color-warning); }
        #toast.info { border-left: 4px solid var(--color-info); }
        @media (max-width: 370px) {
            #header h1 { font-size: 0.9rem; }
            .quick-action-btn { min-width: 48px; min-height: 48px; padding: 6px 8px; }
            .quick-action-btn .btn-icon { font-size: 1.1rem; }
            .quick-action-btn .btn-label { font-size: 0.45rem; }
            .sync-status { font-size: 0.45rem; padding: 1px 4px; }
        }
        @media (min-width: 768px) {
            .quick-action-btn { min-width: 80px; min-height: 70px; max-width: 100px; }
            .quick-action-btn .btn-icon { font-size: 1.8rem; }
            .quick-action-btn .btn-label { font-size: 0.65rem; }
            #header h1 { font-size: 1.4rem; }
        }
        .emergency-mode .quick-action-btn {
            min-width: 76px;
            min-height: 64px;
        }
        .emergency-mode .quick-action-btn .btn-icon { font-size: 1.8rem; }
        .emergency-mode .quick-action-btn .btn-label { font-size: 0.6rem; }
        .emergency-mode #header { min-height: 48px; padding: 6px 10px; }
        .low-data-mode #map-legend { display: none; }
        .low-data-mode .header-actions #lowDataBtn { display: none; }
        .low-data-mode .stats-content { display: none; }
        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --color-light: #1a1a2e;
                --color-white: #16213e;
                --color-dark: #ecf0f1;
                --color-gray: #7f8c8d;
                --shadow: 0 2px 10px rgba(0,0,0,0.4);
            }
            .quick-action-btn { background: #2a2a4a; }
            .quick-action-btn .btn-label { color: var(--color-light); }
            .quick-action-btn.safe-btn .btn-label,
            .quick-action-btn.help-btn .btn-label,
            .quick-action-btn.damage-btn .btn-label,
            .quick-action-btn.road-btn .btn-label,
            .quick-action-btn.resources-btn .btn-label { color: white; }
            .stats-toggle { background: rgba(30,30,60,0.95); color: var(--color-light); }
            .stats-content { background: rgba(30,30,60,0.97); color: var(--color-light); }
            .stat-value { color: #5a9eff; }
            #modal-container { background: #1a1a2e; }
            .modal-title { color: #5a9eff; }
            .modal-form-group input,
            .modal-form-group textarea {
                background: #2a2a4a;
                border-color: #3a3a5a;
                color: var(--color-light);
            }
            .checkbox-group label { background: #2a2a4a; color: var(--color-light); }
            .checkbox-group label:has(input:checked) { background: var(--color-primary); }
            .map-control-btn { background: #2a2a4a; color: var(--color-light); }
        }
    </style>
</head>
<body>
    <div id="app">
        <header id="header">
            <div class="header-content">
                <h1>🗺️ MAPA VIVO</h1>

                <span id="syncStatus" class="sync-status synced">✅ Sincronizado</span>

            <div id="quick-actions">
                <button id="safeBtn" class="quick-action-btn safe-btn">

                </button>
                <button id="helpBtn" class="quick-action-btn help-btn">
                    <span class="btn-icon">🆘</span>
                    <span class="btn-label">NECESITO AYUDA</span>
                </button>
                <button id="damageBtn" class="quick-action-btn damage-btn">
                    <span class="btn-icon">🏚️</span>
                    <span class="btn-label">REPORTAR DAÑO</span>

                    <div class="stat-item"><span class="stat-value" id="statDamage">0</span> Daños reportados</div>
                    <div class="stat-item"><span class="stat-value" id="statRoads">0</span> Vías afectadas</div>
                    <div class="stat-item"><span class="stat-value" id="statResources">0</span> Recursos</div>
                    <div class="stat-item"><span class="stat-value" id="statEarthquakes">0</span> Eventos sísmicos</div>
                    <div class="stat-item"><span class="stat-value" id="statPending">0</span> Pendientes sincronizar</div>

            </div>

            <div id="offline-indicator" class="hidden">
                📡 SIN CONEXIÓN
                <span>Los reportes se guardarán localmente</span>
            </div>
        </main>

        <div id="modal-overlay" class="hidden">
            <div id="modal-container">
                <button id="modalClose" class="modal-close">✕</button>
                <div id="modal-content"></div>
            </div>
        </div>

        <div id="toast" class="hidden"></div>
    </div>

      class GeolocationManager {
    constructor() {
        this.position = null;
    }

    getCurrentPosition() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) {
                // ⚠️ SOLO si NO hay GPS, usar Quibdó
                this.position = {
                    latitude: 5.6900,
                    longitude: -76.6600,
                    accuracy: 99999,
                    timestamp: Date.now()
                };
                showToast('📍 GPS no disponible, usando Quibdó', 'warning');
                resolve(this.position);
                return;
            }
            
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    // ✅ USA TU UBICACIÓN REAL
                    this.position = {
                        latitude: pos.coords.latitude,
                        longitude: pos.coords.longitude,
                        accuracy: pos.coords.accuracy,
                        timestamp: pos.timestamp
                    };
                    resolve(this.position);
                },
                (error) => {
                    // ⚠️ SOLO si el GPS FALLA, usar Quibdó
                    console.warn('GPS falló:', error.message);
                    this.position = {
                        latitude: 5.6900,
                        longitude: -76.6600,
                        accuracy: 99999,
                        timestamp: Date.now()
                    };
                    showToast('📍 GPS falló, usando Quibdó', 'warning');
                    resolve(this.position);
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
            );
        });
    }


            getDistance(lat1, lon1, lat2, lon2) {
                const R = 6371;
                const dLat = this.toRad(lat2 - lat1);
                const dLon = this.toRad(lon2 - lon1);
                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(this.toRad(lat1)) * Math.cos(this.toRad(lat2)) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            }

            toRad(deg) { return deg * Math.PI / 180; }

        // OFFLINE
        // ============================================================
        class OfflineManager {
            constructor() {
                this.dbName = 'MapaVivoDB';
                this.dbVersion = 2;
                this.db = null;
                this.isReady = false;
            }

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.dbVersion);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('reports')) {
                            db.createObjectStore('reports', { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains('pending')) {
                            db.createObjectStore('pending', { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains('sync_queue')) {
                            const store = db.createObjectStore('sync_queue', { keyPath: 'id', autoIncrement: true });
                            store.createIndex('status', 'status');
                            store.createIndex('created_at', 'created_at');
                        }
                        if (!db.objectStoreNames.contains('images')) {
                            db.createObjectStore('images', { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        this.isReady = true;
                        resolve();
                    };
                    request.onerror = () => reject(request.error);
                });
            }

            async saveReport(report) {
                if (!this.isReady) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(['reports', 'pending', 'sync_queue'], 'readwrite');
                    const reportsStore = tx.objectStore('reports');
                    const pendingStore = tx.objectStore('pending');
                    const syncQueueStore = tx.objectStore('sync_queue');

                    const reportData = { ...report, synced: false, savedAt: Date.now() };
                    reportsStore.put(reportData);
                    pendingStore.put({ ...reportData, syncAttempts: 0 });

                    syncQueueStore.add({
                        operation: 'INSERT',
                        table: 'reports',
                        data: report,
                        status: 'pending',
                        created_at: Date.now(),
                        retry_count: 0
                    });

                    tx.oncomplete = () => {
                        this.updatePendingCount();
                        resolve(reportData);
                    };
                    tx.onerror = () => reject(tx.error);
                });
            }

            async getPending() {
                if (!this.isReady) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(['pending'], 'readonly');
                    const store = tx.objectStore('pending');
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = () => reject(request.error);
                });
            }

            async markSynced(id) {
                if (!this.isReady) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(['pending', 'sync_queue'], 'readwrite');
                    const pendingStore = tx.objectStore('pending');
                    const syncQueueStore = tx.objectStore('sync_queue');

                    pendingStore.delete(id);

                    const index = syncQueueStore.index('status');
                    const request = index.getAll('pending');
                    request.onsuccess = () => {
                        const items = request.result || [];
                        for (const item of items) {
                            if (item.data && item.data.id === id) {
                                const updateTx = this.db.transaction(['sync_queue'], 'readwrite');
                                const updateStore = updateTx.objectStore('sync_queue');
                                const updatedItem = { ...item, status: 'completed', completed_at: Date.now() };
                                updateStore.put(updatedItem);
                            }
                        }
                    };

                    tx.oncomplete = () => {
                        this.updatePendingCount();
                        resolve(true);
                    };
                    tx.onerror = () => reject(tx.error);
                });
            }

            async markSyncError(id, errorMessage) {
                if (!this.isReady) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(['sync_queue'], 'readwrite');
                    const store = tx.objectStore('sync_queue');
                    const index = store.index('status');
                    const request = index.getAll('pending');
                    request.onsuccess = () => {
                        const items = request.result || [];
                        for (const item of items) {
                            if (item.data && item.data.id === id) {
                                const updatedItem = {
                                    ...item,
                                    status: 'error',
                                    error_message: errorMessage,
                                    retry_count: (item.retry_count || 0) + 1
                                };
                                store.put(updatedItem);
                            }
                        }
                    };
                    tx.oncomplete = () => {
                        this.updatePendingCount();
                        resolve(true);
                    };
                    tx.onerror = () => reject(tx.error);
                });
            }

            async getAllReports() {
                if (!this.isReady) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(['reports'], 'readonly');
                    const store = tx.objectStore('reports');
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = () => reject(request.error);
                });
            }

            async updatePendingCount() {
                const pending = await this.getPending();
                const count = pending.length;
                document.getElementById('statPending').textContent = count;
                const syncStatus = document.getElementById('syncStatus');
                if (!navigator.onLine) {
                    syncStatus.textContent = '📡 Offline';
                    syncStatus.className = 'sync-status offline';
                } else if (count > 0) {
                    syncStatus.textContent = `⏳ ${count} pendientes`;
                    syncStatus.className = 'sync-status pending';
                } else {
                    syncStatus.textContent = '✅ Sincronizado';
                    syncStatus.className = 'sync-status synced';
                }
            }
        }

         async createReport(data) {
    if (!this.authReady || !this.userId) {
        showToast('⏳ Esperando autenticación...', 'warning');
        return null;
    }

    const now = Date.now();
    if (now - this.lastReportTime < 30000) {
        showToast('Espera unos segundos antes de enviar otro reporte', 'warning');
        return null;
    }
    this.lastReportTime = now;

    const userId = this.getUserId();

    // ✅ Generar UUID válido
    const report = {
        id: crypto.randomUUID(), // 👈 ESTO ES LO QUE FALTA
        ...data,
        user_id: userId,
        created_at: new Date(now).toISOString(),
        updated_at: new Date(now).toISOString(),
        status: 'active',
        confidence: 'reported',
        verification_count: 0,
        is_public: true
    };

    let serverSuccess = false;
    let insertedReport = null;

    try {
        const { data: inserted, error } = await supabaseClient
            .from('reports')
            .insert([report])
            .select();

        if (error) throw error;

        if (inserted && inserted.length > 0) {
            serverSuccess = true;
            insertedReport = inserted[0];
            showToast('✅ Reporte enviado y compartido', 'success');
            // 🟢 LLAMAR A LA CONFIRMACIÓN
            showConfirmation(insertedReport);
        }
    } catch (error) {
        console.warn('Error en Supabase:', error);
        serverSuccess = false;
    }

    if (!serverSuccess) {
        if (!navigator.onLine) {
            await offline.saveReport(report);
            showToast('📡 Sin conexión. Reporte guardado localmente.', 'warning');
        } else {
            showToast('❌ Error al enviar. Intenta de nuevo.', 'error');
            return null;
        }
        // Si se guardó localmente, también mostramos confirmación con los datos locales
        showConfirmation(report);
    }

    if (report.latitude && report.longitude) {
        const type = report.type || 'resource';
        const label = report.description || report.type || 'Reporte';
        mapManager.addMarker(report.latitude, report.longitude, type, label, report.id);
    }

    this.reports.push(report);
    this.updateStats();
    await offline.updatePendingCount();
    return report;
}

            async syncPendingReports() {
                if (this.isSyncing) return;
                if (!navigator.onLine) {
                    await offline.updatePendingCount();
                    return;
                }

                if (!this.authReady || !this.userId) {
                    console.log('⏳ Esperando autenticación para sincronizar...');
                    return;
                }

                this.isSyncing = true;

                try {
                    const pending = await offline.getPending();
                    if (pending.length === 0) {
                        this.isSyncing = false;
                        await offline.updatePendingCount();
                        return;
                    }

                    showToast(`🔄 Sincronizando ${pending.length} reportes...`, 'info');
                    let synced = 0;

                    for (const report of pending) {
                        if (!report.user_id) {
                            report.user_id = this.userId;
                        }

                        const { data: existing } = await supabaseClient
                            .from('reports')
                            .select('id')
                            .eq('id', report.id)
                            .maybeSingle();

                        if (existing) {
                            await offline.markSynced(report.id);
                            synced++;
                            continue;
                        }

                        const { error } = await supabaseClient
                            .from('reports')
                            .insert([{
                                id: report.id,
                                type: report.type,
                                latitude: report.latitude,
                                longitude: report.longitude,
                                municipality: report.municipality,
                                description: report.description,
                                user_id: report.user_id || this.userId,
                                status: report.status || 'active',
                                confidence: report.confidence || 'reported',
                                created_at: report.created_at || new Date().toISOString(),
                                updated_at: new Date().toISOString(),
                                is_public: true,
                                needs: report.needs || null,
                                injured_count: report.injured_count || 0,
                                in_danger: report.in_danger || false,
                                people_count: report.people_count || 0
                            }]);

                        if (!error) {
                            await offline.markSynced(report.id);
                            synced++;
                        } else {
                            await offline.markSyncError(report.id, error.message);
                        }
                    }

                    if (synced > 0) {
                        showToast(`✅ ${synced} reportes sincronizados`, 'success');
                    }

                    await offline.updatePendingCount();

                } catch (error) {
                    console.error('Error en sincronización:', error);
                }

                this.isSyncing = false;
                this.loadReports();
            }

            async loadReports() {
                if (!this.authReady || !this.userId) {
                    console.log('⏳ Esperando autenticación para cargar reportes...');
                    const localReports = await offline.getAllReports();
                    this.reports = localReports;
                    this.updateStats();
                    return this.reports;
                }

                let serverReports = [];
                try {
                    const { data, error } = await supabaseClient
                        .from('reports')
                        .select('*')
                        .eq('status', 'active')
                        .order('created_at', { ascending: false })
                        .limit(200);

                    if (!error && data) {
                        serverReports = data;
                    }
                } catch (error) {
                    console.warn('Error cargando desde Supabase:', error);
                }

                const localReports = await offline.getAllReports();

                const allReports = [...serverReports];
                const serverIds = new Set(serverReports.map(r => r.id));
                for (const local of localReports) {
                    if (!serverIds.has(local.id)) {
                        allReports.push(local);
                    }
                }

                this.reports = allReports;

                mapManager.clearMarkers();
                for (const report of this.reports) {
                    if (report.latitude && report.longitude) {
                        const type = report.type || 'resource';
                        const label = report.description || report.type || 'Reporte';
                        mapManager.addMarker(
                            report.latitude,
                            report.longitude,
                            type,
                            label,
                            report.id
                        );
                    }
                }

                await offline.updatePendingCount();
                this.updateStats();
                return this.reports;
            }

            async corroborateReport(reportId) {
                if (!this.authReady || !this.userId) {
                    showToast('⏳ Esperando autenticación...', 'warning');
                    return false;
                }

                try {
                    const { data, error } = await supabaseClient
                        .rpc('increment_report_verification', {

                        });

                    if (error) {
                        if (error.message.includes('Ya has corroborado')) {

                        } else if (error.message.includes('No puedes corroborar tu propio reporte')) {
                            showToast('No puedes corroborar tu propio reporte', 'warning');
                        } else if (error.message.includes('Usuario no autenticado')) {
                            showToast('Debes estar autenticado para corroborar', 'error');
                        } else {
                            showToast('Error al corroborar: ' + error.message, 'error');
                        }
                        return false;
                    }

                    showToast('✅ Reporte corroborado', 'success');
                    this.loadReports();
                    return true;

                } catch (error) {
                    console.error('Error corroborando:', error);
                    showToast('Error al corroborar', 'error');
                    return false;
                }
            }

            updateStats() {

                document.getElementById('statDamage').textContent = stats.damage;

      async function fetchEarthquakes() {

        const response = await fetch('https://qytywodntuikvotimpzs.supabase.co/functions/v1/earthquakes');

        // Si la respuesta no es exitosa, lanzar error
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        // La respuesta puede ser un array o un objeto con 'features'
        const events = Array.isArray(data) ? data : (data.features || []);

        if (events.length === 0) {
            document.getElementById('statEarthquakes').textContent = '0';

        return events;

    } catch (error) {
        console.warn('⚠️ SGC API no disponible:', error.message);
        document.getElementById('statEarthquakes').textContent = '⚠️';
        return [];
    }

        async function uploadImage(file, reportId) {
            if (!reports.authReady || !reports.userId) {
                showToast('⏳ Esperando autenticación...', 'warning');
                return null;
            }

            try {
                if (!file || !reportId) return null;

                const compressed = await compressImage(file, 800, 0.7);
                const userId = reports.userId;
                const fileName = `${userId}/${reportId}_${Date.now()}.webp`;

                const { data, error } = await supabaseClient.storage
                    .from('report-images')
                    .upload(fileName, compressed, {
                        contentType: 'image/webp',
                        cacheControl: '3600'
                    });

                if (error) {
                    console.warn('Error subiendo imagen:', error);
                    return null;
                }

                const { data: urlData } = supabaseClient.storage
                    .from('report-images')
                    .getPublicUrl(fileName);

                return urlData?.publicUrl || null;

            } catch (error) {
                console.error('Error en uploadImage:', error);
                return null;
            }
        }

        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = (maxWidth / width) * height;
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            if (blob) resolve(blob);
                            else reject(new Error('Error comprimiendo imagen'));
                        }, 'image/webp', quality);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
            });
        }

        function showSafeModal() {
            openModal(`
                    <div class="modal-title">🟢 ESTOY A SALVO</div>
                    <div style="text-align:center;margin-bottom:16px;">

                    </div>
                    <div class="modal-form-group">
                        <label>¿Estás a salvo?</label>
                        <button class="btn-primary success" id="safeConfirmBtn">✅ SÍ, ESTOY A SALVO</button>
                    </div>
                    <div class="modal-form-group" id="safeExtra" style="display:none;">
                        <label>¿Hay otras personas contigo?</label>
                        <div style="display:flex;gap:8px;">
                            <button class="btn-secondary" id="safePeopleNo">NO</button>
                            <button class="btn-secondary" id="safePeopleYes">SÍ</button>
                        </div>
                    </div>
                    <div class="modal-form-group" id="safePeopleCount" style="display:none;">
                        <label>Número aproximado:</label>
                        <div style="display:flex;align-items:center;gap:12px;justify-content:center;">
                            <button class="map-control-btn" id="peopleMinus">−</button>
                            <span id="peopleCount" style="font-size:1.5rem;font-weight:700;min-width:40px;text-align:center;">3</span>
                            <button class="map-control-btn" id="peoplePlus">+</button>
                        </div>
                    </div>
                    <button class="btn-primary success" id="safePublishBtn" style="display:none;">📤 PUBLICAR</button>
                `);

            let peopleCount = 3;

            document.getElementById('safeConfirmBtn').addEventListener('click', () => {
                document.getElementById('safeExtra').style.display = 'block';
                document.getElementById('safeConfirmBtn').disabled = true;
            });

            document.getElementById('safePeopleYes').addEventListener('click', () => {
                document.getElementById('safePeopleCount').style.display = 'block';
                document.getElementById('safePublishBtn').style.display = 'block';
            });

            document.getElementById('safePeopleNo').addEventListener('click', () => {
                document.getElementById('safePublishBtn').style.display = 'block';
            });

            document.getElementById('peopleMinus').addEventListener('click', () => {
                peopleCount = Math.max(1, peopleCount - 1);
                document.getElementById('peopleCount').textContent = peopleCount;
            });

            document.getElementById('peoplePlus').addEventListener('click', () => {
                peopleCount = Math.min(20, peopleCount + 1);
                document.getElementById('peopleCount').textContent = peopleCount;
            });

            document.getElementById('safePublishBtn').addEventListener('click', async () => {
                try {
                    const pos = await geolocation.getCurrentPosition();
                    const location = await geolocation.getLocationName(pos.latitude, pos.longitude);

                    const report = {
                        type: 'safe',
                        latitude: pos.latitude,
                        longitude: pos.longitude,
                        municipality: location,
                        description: `${peopleCount} personas a salvo`,
                        people_count: peopleCount
                    };

                    await reports.createReport(report);
                    closeModal();

                    setTimeout(() => reports.syncPendingReports(), 2000);

                } catch (error) {
                    showToast('Error: ' + error.message, 'error');
                }
            });

        function showHelpModal() {
            const needs = ['Rescate', 'Atención médica', 'Agua', 'Alimentos', 'Refugio', 'Medicamentos',
                'Electricidad', 'Comunicación', 'Transporte', 'Ayuda para niños', 'Ayuda para adultos mayores', 'Otro'

            openModal(`
                    <div class="modal-title">🆘 NECESITO AYUDA</div>
                    <div class="modal-form-group">
                        <label>¿Qué necesitas? (puedes elegir varias)</label>
                        <div class="checkbox-group" id="helpNeeds">
                            ${needs.map(n => `<label><input type="checkbox" value="${n}"> ${n}</label>`).join('')}

                    <div class="modal-form-group">

                    </div>

                        <label>¿Cuántas?</label>

                    </div>

                        <label>¿Estás en peligro inmediato?</label>
                        <div style="display:flex;gap:8px;">

                `);

            let inDanger = false;
            let selectedFile = null;

            document.getElementById('helpInjuredYes').addEventListener('click', () => {
                hasInjured = true;
                document.getElementById('helpInjuredCount').style.display = 'block';
            });

            document.getElementById('helpInjuredNo').addEventListener('click', () => {
                hasInjured = false;
                document.getElementById('helpInjuredCount').style.display = 'none';
            });

            document.getElementById('helpDangerYes').addEventListener('click', () => {
                inDanger = true;
                document.getElementById('helpDangerYes').style.background = '#c0392b';
                document.getElementById('helpDangerNo').style.background = '';
            });

            document.getElementById('helpDangerNo').addEventListener('click', () => {
                inDanger = false;
                document.getElementById('helpDangerNo').style.background = '#2ecc71';
                document.getElementById('helpDangerYes').style.background = '';
            });

            document.getElementById('helpPhoto').addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    selectedFile = e.target.files[0];
                }
            });

            document.getElementById('helpPublishBtn').addEventListener('click', async () => {
                try {
                    const checked = document.querySelectorAll('#helpNeeds input:checked');
                    if (checked.length === 0) {
                        showToast('Selecciona al menos una necesidad', 'warning');
                        return;
                    }

                    const pos = await geolocation.getCurrentPosition();
                    const location = await geolocation.getLocationName(pos.latitude, pos.longitude);

                    const needs = Array.from(checked).map(cb => cb.value);
                    const injured = parseInt(document.getElementById('helpInjuredInput').value) || 0;

                    const reportData = {
                        type: 'help',
                        latitude: pos.latitude,
                        longitude: pos.longitude,
                        municipality: location,
                        needs: needs,
                        injured_count: hasInjured ? injured : 0,
                        in_danger: inDanger,
                        description: `Necesita: ${needs.join(', ')}`
                    };

                    const report = await reports.createReport(reportData);

                    if (selectedFile && report) {
                        const imageUrl = await uploadImage(selectedFile, report.id);
                        if (imageUrl) {
                            await supabaseClient
                                .from('reports')
                                .update({ image_url: imageUrl })
                                .eq('id', report.id);
                        }
                    }

                    closeModal();
                    setTimeout(() => reports.syncPendingReports(), 2000);

                } catch (error) {
                    showToast('Error: ' + error.message, 'error');
                }
            });
        }

        function showDamageModal() {
            const types = ['Vivienda', 'Edificio', 'Escuela', 'Hospital', 'Comercio', 'Puente', 'Carretera', 'Poste', 'Red eléctrica', 'Acueducto', 'Otro'];
            const levels = ['Sin daño visible', 'Daño leve', 'Daño importante', 'Daño grave', 'Colapso'];

            openModal(`
                    <div class="modal-title">🏚️ REPORTAR DAÑO</div>
                    <div class="modal-form-group">
                        <label>Tipo de afectación:</label>
                        <div class="checkbox-group" id="damageTypes">
                            ${types.map(t => `<label><input type="checkbox" value="${t}"> ${t}</label>`).join('')}
                        </div>
                    </div>
                    <div class="modal-form-group">
                        <label>Nivel aparente:</label>

            document.querySelectorAll('[data-level]').forEach(btn => {

                    document.querySelectorAll('[data-level]').forEach(b => {
                        b.style.background = '';

                    btn.style.color = 'white';

            });

            document.getElementById('damagePhoto').addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    selectedFile = e.target.files[0];
                }
            });

            document.getElementById('damagePublishBtn').addEventListener('click', async () => {
                try {
                    const checked = document.querySelectorAll('#damageTypes input:checked');

                        return;
                    }

                    if (selectedLevel === null) {
                        showToast('Selecciona un nivel de daño', 'warning');
                        return;
                    }

                    const pos = await geolocation.getCurrentPosition();

                    const types = Array.from(checked).map(cb => cb.value);
                    const levelsList = ['sin_daño', 'daño_leve', 'daño_importante', 'daño_grave', 'colapso'];

                        longitude: pos.longitude,

                    const report = await reports.createReport(reportData);

                    if (selectedFile && report) {
                        const imageUrl = await uploadImage(selectedFile, report.id);
                        if (imageUrl) {
                            await supabaseClient
                                .from('reports')
                                .update({ image_url: imageUrl })
                                .eq('id', report.id);
                        }

                    closeModal();
                    setTimeout(() => reports.syncPendingReports(), 2000);

                } catch (error) {
                    showToast('Error: ' + error.message, 'error');
                }
            });

        function showResourcesModal() {
            openModal(`
                    <div class="modal-title">📍 RECURSOS</div>
                    <div style="margin-bottom:12px;font-size:0.85rem;color:#666;">
                        Recursos y centros de ayuda cercanos
                    </div>
                    <div id="resourcesList" style="max-height:300px;overflow-y:auto;">
                        <div style="text-align:center;padding:20px;color:#666;">Cargando recursos...</div>
                    </div>
                    <div style="margin-top:12px;padding:8px;background:#f0f0f0;border-radius:8px;font-size:0.7rem;color:#666;">
                        ℹ️ Los datos se actualizan desde fuentes oficiales y comunitarias verificadas
                    </div>
                    <button class="btn-secondary" onclick="closeModal()">Cerrar</button>
                `);

            supabaseClient
                .from('resources')
                .select('*')
                .limit(50)
                .then(({ data, error }) => {
                    const list = document.getElementById('resourcesList');
                    if (error || !data || data.length === 0) {
                        list.innerHTML = `
                                <div style="text-align:center;padding:20px;color:#666;">
                                    No hay recursos registrados aún.<br>
                                    <span style="font-size:0.7rem;">Los recursos se agregan desde fuentes oficiales</span>
                                </div>
                            `;
                        return;
                    }

                    list.innerHTML = data.map(r => `
                            <div style="padding:10px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px;cursor:pointer;"
                                 onclick="mapManager.goToLocation(${r.latitude}, ${r.longitude}, 15); closeModal();">
                                <span style="font-size:1.2rem;">📍</span>
                                <div style="flex:1;">
                                    <strong>${r.name}</strong>
                                    <br><span style="font-size:0.7rem;color:#666;">${r.type} ${r.municipality ? '• ' + r.municipality : ''}</span>
                                    ${r.availability ? `<br><span style="font-size:0.65rem;color:${r.availability === 'disponible' ? '#2ecc71' : r.availability === 'limitado' ? '#f39c12' : '#e74c3c'};">${r.availability}</span>` : ''}
                                </div>
                                <span style="font-size:0.7rem;color:#666;">${r.source_type || 'oficial'}</span>
                            </div>
                        `).join('');
                });
        }

        // ============================================================
        // INICIALIZACIÓN
        // ============================================================
        async function init() {
            console.log('🗺️ Iniciando Mapa Vivo Colombia');
            console.log('📡 Conectado a Supabase:', CONFIG.supabaseUrl);

            await reports.initAuth();

            mapManager.init('map');

            try {
                const pos = await geolocation.getCurrentPosition();
                if (pos) {
                    mapManager.goToLocation(pos.latitude, pos.longitude, 12);
                }
            } catch (e) {
                console.log('Ubicación no disponible:', e.message);
            }

            await fetchEarthquakes();
            await reports.loadReports();
            setTimeout(() => reports.syncPendingReports(), 3000);

            document.getElementById('safeBtn').addEventListener('click', showSafeModal);
            document.getElementById('helpBtn').addEventListener('click', showHelpModal);
            document.getElementById('damageBtn').addEventListener('click', showDamageModal);
            document.getElementById('roadBtn').addEventListener('click', showRoadModal);
            document.getElementById('resourcesBtn').addEventListener('click', showResourcesModal);

            document.getElementById('myLocationBtn').addEventListener('click', () => {
                mapManager.centerOnUser();
            });

            document.getElementById('zoomInBtn').addEventListener('click', () => {
                if (mapManager.map) mapManager.map.zoomIn();
            });

            document.getElementById('zoomOutBtn').addEventListener('click', () => {
                if (mapManager.map) mapManager.map.zoomOut();
            });

            document.getElementById('statsToggle').addEventListener('click', () => {
                document.getElementById('statsContent').classList.toggle('hidden');
            });

            document.getElementById('emergencyModeBtn').addEventListener('click', () => {
                document.getElementById('app').classList.toggle('emergency-mode');
                showToast(
                    document.getElementById('app').classList.contains('emergency-mode') ?
                    '🚨 MODO EMERGENCIA' : 'Modo normal',
                    'info'
                );
            });

            document.getElementById('lowDataBtn').addEventListener('click', () => {
                document.getElementById('app').classList.toggle('low-data-mode');
                showToast(
                    document.getElementById('app').classList.contains('low-data-mode') ?
                    '📶 BAJO CONSUMO' : 'Modo normal',
                    'info'
                );
            });

            window.addEventListener('online', () => {
                document.getElementById('connectionStatus').className = 'connection-status online';
                document.getElementById('connectionStatus').querySelector('.status-text').textContent = 'Conectado';
                document.getElementById('offline-indicator').classList.add('hidden');
                reports.syncPendingReports();
            });

            window.addEventListener('offline', () => {
                document.getElementById('connectionStatus').className = 'connection-status offline';
                document.getElementById('connectionStatus').querySelector('.status-text').textContent = 'Sin conexión';
                document.getElementById('offline-indicator').classList.remove('hidden');
                offline.updatePendingCount();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === '1') document.getElementById('safeBtn').click();
                if (e.key === '2') document.getElementById('helpBtn').click();
                if (e.key === '3') document.getElementById('damageBtn').click();
                if (e.key === '4') document.getElementById('roadBtn').click();
                if (e.key === '5') document.getElementById('resourcesBtn').click();
            });

            setInterval(() => {
                if (navigator.onLine && reports.authReady) {
                    reports.syncPendingReports();
                }
            }, 30000);

            console.log('✅ Aplicación lista');
            console.log('👤 Usuario autenticado:', reports.authReady);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
