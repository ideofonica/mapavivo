<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mapa Vivo Colombia</title>
    <meta name="description" content="Herramienta comunitaria para emergencias sísmicas en Colombia" />
    <meta name="theme-color" content="#1a3c6e" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.5.1/dist/maplibre-gl.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --color-primary: #1a3c6e;
            --color-success: #2ecc71;
            --color-danger: #e74c3c;
            --color-warning: #f39c12;
            --color-info: #3498db;
            --color-dark: #2c3e50;
            --color-light: #ecf0f1;
            --color-white: #ffffff;
            --color-gray: #95a5a6;
            --shadow: 0 2px 10px rgba(0,0,0,0.15);
            --radius: 12px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: var(--font-family);
            background: var(--color-light);
            color: var(--color-dark);
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            position: fixed;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: relative;
            background: var(--color-light);
        }
        #header {
            background: var(--color-primary);
            color: var(--color-white);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 100;
            min-height: 52px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .header-content {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            flex-wrap: wrap;
        }
        #header h1 { font-size: 1.1rem; font-weight: 700; margin: 0; }
        .header-subtitle { font-size: 0.65rem; opacity: 0.8; letter-spacing: 1px; }
        .header-actions { display: flex; gap: 4px; }
        .header-actions button {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            min-width: 36px;
            min-height: 36px;
        }
        #connectionStatus {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.65rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            flex-shrink: 0;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .connection-status.online .status-dot { background: var(--color-success); }
        .connection-status.offline .status-dot { background: var(--color-danger); }
        .sync-status {
            font-size: 0.55rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(255,255,255,0.15);
            margin-left: 4px;
            white-space: nowrap;
            font-weight: 600;
        }
        .sync-status.pending { background: var(--color-warning); color: #2c3e50; }
        .sync-status.synced { background: var(--color-success); color: white; }
        .sync-status.error { background: var(--color-danger); color: white; }
        .sync-status.offline { background: var(--color-gray); color: white; }
        #main-content {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #map-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #map-controls {
            position: absolute;
            right: 12px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
        }
        .map-control-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: var(--color-white);
            box-shadow: var(--shadow);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .map-control-btn#myLocationBtn { background: var(--color-primary); color: white; }
        #quick-actions {
            position: absolute;
            bottom: 16px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 0 8px;
            z-index: 20;
            flex-wrap: wrap;
        }
        .quick-action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            border: none;
            border-radius: var(--radius);
            background: var(--color-white);
            box-shadow: var(--shadow);
            cursor: pointer;
            min-width: 60px;
            min-height: 56px;
            flex: 1;
            max-width: 80px;
            transition: transform 0.1s;
        }
        .quick-action-btn:active { transform: scale(0.95); }
        .quick-action-btn .btn-icon { font-size: 1.4rem; }
        .quick-action-btn .btn-label {
            font-size: 0.55rem;
            font-weight: 600;
            text-align: center;
            margin-top: 2px;
            color: var(--color-dark);
        }
        .quick-action-btn.safe-btn { background: var(--color-success); color: white; }
        .quick-action-btn.safe-btn .btn-label { color: white; }
        .quick-action-btn.help-btn { background: var(--color-danger); color: white; }
        .quick-action-btn.help-btn .btn-label { color: white; }
        .quick-action-btn.damage-btn { background: var(--color-warning); color: white; }
        .quick-action-btn.damage-btn .btn-label { color: white; }
        .quick-action-btn.road-btn { background: var(--color-info); color: white; }
        .quick-action-btn.road-btn .btn-label { color: white; }
        .quick-action-btn.resources-btn { background: var(--color-primary); color: white; }
        .quick-action-btn.resources-btn .btn-label { color: white; }
        #stats-panel {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 15;
        }
        .stats-toggle {
            background: rgba(255,255,255,0.95);
            border: none;
            border-radius: 20px;
            padding: 6px 12px;
            box-shadow: var(--shadow);
            cursor: pointer;
            font-size: 0.75rem;
        }
        .stats-content {
            background: rgba(255,255,255,0.97);
            border-radius: var(--radius);
            padding: 12px;
            margin-top: 6px;
            box-shadow: var(--shadow);
            min-width: 140px;
        }
        .stats-content.hidden { display: none; }
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.7rem;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .stat-value { font-weight: 700; color: var(--color-primary); font-size: 0.85rem; }
        #offline-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 16px 24px;
            border-radius: var(--radius);
            text-align: center;
            z-index: 50;
            font-weight: 500;
            backdrop-filter: blur(8px);
        }
        #offline-indicator span {
            display: block;
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 4px;
        }
        #offline-indicator.hidden { display: none; }
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            backdrop-filter: blur(4px);
        }
        #modal-overlay.hidden { display: none; }
        #modal-container {
            background: var(--color-white);
            border-radius: var(--radius);
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            position: relative;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            font-size: 1.4rem;
            color: var(--color-gray);
            cursor: pointer;
        }
        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 16px;
            text-align: center;
        }
        .modal-form-group { margin-bottom: 14px; }
        .modal-form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .modal-form-group input, .modal-form-group select, .modal-form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
        }
        .modal-form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .modal-form-group input:focus, .modal-form-group textarea:focus {
            outline: none;
            border-color: var(--color-primary);
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            background: var(--color-primary);
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary.success { background: var(--color-success); }
        .btn-primary.danger { background: var(--color-danger); }
        .btn-primary.warning { background: var(--color-warning); }
        .btn-secondary {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--color-gray);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-dark);
            background: transparent;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-secondary:active { background: var(--color-light); }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            padding: 6px 12px;
            background: var(--color-light);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .checkbox-group label:has(input:checked) {
            background: var(--color-primary);
            color: white;
        }
        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--color-primary);
        }
        #toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            z-index: 2000;
            max-width: 90%;
            text-align: center;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        #toast.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(10px);
            pointer-events: none;
        }
        #toast.success { border-left: 4px solid var(--color-success); }
        #toast.error { border-left: 4px solid var(--color-danger); }
        #toast.warning { border-left: 4px solid var(--color-warning); }
        #toast.info { border-left: 4px solid var(--color-info); }
        @media (max-width: 370px) {
            #header h1 { font-size: 0.9rem; }
            .quick-action-btn { min-width: 48px; min-height: 48px; padding: 6px 8px; }
            .quick-action-btn .btn-icon { font-size: 1.1rem; }
            .quick-action-btn .btn-label { font-size: 0.45rem; }
            .sync-status { font-size: 0.45rem; padding: 1px 4px; }
        }
        @media (min-width: 768px) {
            .quick-action-btn { min-width: 80px; min-height: 70px; max-width: 100px; }
            .quick-action-btn .btn-icon { font-size: 1.8rem; }
            .quick-action-btn .btn-label { font-size: 0.65rem; }
            #header h1 { font-size: 1.4rem; }
        }
        .emergency-mode .quick-action-btn {
            min-width: 76px;
            min-height: 64px;
        }
        .emergency-mode .quick-action-btn .btn-icon { font-size: 1.8rem; }
        .emergency-mode .quick-action-btn .btn-label { font-size: 0.6rem; }
        .emergency-mode #header { min-height: 48px; padding: 6px 10px; }
        .low-data-mode #map-legend { display: none; }
        .low-data-mode .header-actions #lowDataBtn { display: none; }
        .low-data-mode .stats-content { display: none; }
        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --color-light: #1a1a2e;
                --color-white: #16213e;
                --color-dark: #ecf0f1;
                --color-gray: #7f8c8d;
                --shadow: 0 2px 10px rgba(0,0,0,0.4);
            }
            .quick-action-btn { background: #2a2a4a; }
            .quick-action-btn .btn-label { color: var(--color-light); }
            .quick-action-btn.safe-btn .btn-label,
            .quick-action-btn.help-btn .btn-label,
            .quick-action-btn.damage-btn .btn-label,
            .quick-action-btn.road-btn .btn-label,
            .quick-action-btn.resources-btn .btn-label { color: white; }
            .stats-toggle { background: rgba(30,30,60,0.95); color: var(--color-light); }
            .stats-content { background: rgba(30,30,60,0.97); color: var(--color-light); }
            .stat-value { color: #5a9eff; }
            #modal-container { background: #1a1a2e; }
            .modal-title { color: #5a9eff; }
            .modal-form-group input, .modal-form-group textarea {
                background: #2a2a4a;
                border-color: #3a3a5a;
                color: var(--color-light);
            }
            .checkbox-group label { background: #2a2a4a; color: var(--color-light); }
            .checkbox-group label:has(input:checked) { background: var(--color-primary); }
            .map-control-btn { background: #2a2a4a; color: var(--color-light); }
        }
    </style>
</head>
<body>
    <div id="app">
        <header id="header">
            <div class="header-content">
                <h1>🗺️ MAPA VIVO</h1>
                <span class="header-subtitle">COLOMBIA</span>
                <span id="syncStatus" class="sync-status synced">✅ Sincronizado</span>
                <div class="header-actions">
                    <button id="emergencyModeBtn" aria-label="Modo emergencia">🚨</button>
                    <button id="lowDataBtn" aria-label="Modo bajo consumo">📶</button>
                </div>
            </div>
            <div id="connectionStatus" class="connection-status online">
                <span class="status-dot"></span>
                <span class="status-text">Conectado</span>
            </div>
        </header>

        <main id="main-content">
            <div id="map-container">
                <div id="map"></div>
                <div id="map-controls">
                    <button id="myLocationBtn" class="map-control-btn">📍</button>
                    <button id="zoomInBtn" class="map-control-btn">+</button>
                    <button id="zoomOutBtn" class="map-control-btn">−</button>
                </div>
            </div>

            <div id="quick-actions">
                <button id="safeBtn" class="quick-action-btn safe-btn">
                    <span class="btn-icon">🟢</span>
                    <span class="btn-label">ESTOY A SALVO</span>
                </button>
                <button id="helpBtn" class="quick-action-btn help-btn">
                    <span class="btn-icon">🆘</span>
                    <span class="btn-label">NECESITO AYUDA</span>
                </button>
                <button id="damageBtn" class="quick-action-btn damage-btn">
                    <span class="btn-icon">🏚️</span>
                    <span class="btn-label">REPORTAR DAÑO</span>
                </button>
                <button id="roadBtn" class="quick-action-btn road-btn">
                    <span class="btn-icon">🚧</span>
                    <span class="btn-label">REPORTAR VÍA</span>
                </button>
                <button id="resourcesBtn" class="quick-action-btn resources-btn">
                    <span class="btn-icon">📍</span>
                    <span class="btn-label">RECURSOS</span>
                </button>
            </div>

            <div id="stats-panel">
                <button id="statsToggle" class="stats-toggle">📊 Estadísticas</button>
                <div id="statsContent" class="stats-content hidden">
                    <div class="stat-item"><span class="stat-value" id="statPeople">0</span> Personas seguras</div>
                    <div class="stat-item"><span class="stat-value" id="statHelp">0</span> Solicitudes ayuda</div>
                    <div class="stat-item"><span class="stat-value" id="statDamage">0</span> Daños reportados</div>
                    <div class="stat-item"><span class="stat-value" id="statRoads">0</span> Vías afectadas</div>
                    <div class="stat-item"><span class="stat-value" id="statResources">0</span> Recursos</div>
                    <div class="stat-item"><span class="stat-value" id="statEarthquakes">0</span> Eventos sísmicos</div>
                    <div class="stat-item"><span class="stat-value" id="statPending">0</span> Pendientes sincronizar</div>
                </div>
            </div>

            <div id="offline-indicator" class="hidden">
                📡 SIN CONEXIÓN
                <span>Los reportes se guardarán localmente</span>
            </div>
        </main>

        <div id="modal-overlay" class="hidden">
            <div id="modal-container">
                <button id="modalClose" class="modal-close">✕</button>
                <div id="modal-content"></div>
            </div>
        </div>

        <div id="toast" class="hidden"></div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.5.1/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // ============================================================
        // CONFIGURACIÓN
        // ============================================================
        const CONFIG = {
            supabaseUrl: 'https://qytywodntuikvotimpzs.supabase.co',
            supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5dHl3b2RudHVpa3ZvdGltcHpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NTA4MzcsImV4cCI6MjEwMjIyNjgzN30.DEroSVOkETVrzVOroYuEU1AWQnOcT_TpGE5ljyemyHI',
            mapStyle: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
            mapCenter: [-74.0721, 4.7110],
            mapZoom: 6,
            appPrefix: 'MV'
        };

        const supabaseClient = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
        let currentUser = null, isAuthenticated = false, authReady = false;

        // ============================================================
        // GEOLOCALIZACIÓN - SIN INVENTAR UBICACIÓN
        // ============================================================
        class GeolocationManager {
            constructor() { this.position = null; }
            getCurrentPosition() {
                return new Promise((resolve, reject) => {
                    if (!navigator.geolocation) {
                        reject(new Error('Tu dispositivo no tiene GPS. Por favor, selecciona tu ubicación en el mapa.'));
                        return;
                    }
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            this.position = {
                                latitude: pos.coords.latitude,
                                longitude: pos.coords.longitude,
                                accuracy: pos.coords.accuracy,
                                timestamp: pos.timestamp
                            };
                            resolve(this.position);
                        },
                        (error) => {
                            console.warn('GPS falló:', error.message);
                            reject(new Error('No se pudo obtener tu ubicación. Por favor, selecciona tu ubicación en el mapa.'));
                        },
                        { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
                    );
                });
            }
            getDistance(lat1, lon1, lat2, lon2) {
                const R = 6371;
                const dLat = this.toRad(lat2 - lat1);
                const dLon = this.toRad(lon2 - lon1);
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(this.toRad(lat1)) * Math.cos(this.toRad(lat2)) * Math.sin(dLon/2) * Math.sin(dLon/2);
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            }
            toRad(deg) { return deg * Math.PI / 180; }
            async getLocationName(lat, lon) {
                const cities = [
                    { name: 'Bogotá', lat: 4.7110, lon: -74.0721, radius: 50 },
                    { name: 'Medellín', lat: 6.2442, lon: -75.5812, radius: 40 },
                    { name: 'Cali', lat: 3.4516, lon: -76.5320, radius: 40 },
                    { name: 'Barranquilla', lat: 10.9639, lon: -74.7963, radius: 35 },
                    { name: 'Cartagena', lat: 10.3910, lon: -75.4794, radius: 30 },
                    { name: 'Bucaramanga', lat: 7.1193, lon: -73.1227, radius: 30 },
                    { name: 'Pereira', lat: 4.8133, lon: -75.6961, radius: 25 },
                    { name: 'Cúcuta', lat: 7.8939, lon: -72.5078, radius: 25 },
                    { name: 'Ibagué', lat: 4.4389, lon: -75.2322, radius: 25 },
                    { name: 'Villavicencio', lat: 4.1530, lon: -73.6350, radius: 20 },
                    { name: 'Pasto', lat: 1.2136, lon: -77.2811, radius: 20 },
                    { name: 'Manizales', lat: 5.0600, lon: -75.5190, radius: 20 },
                    { name: 'Neiva', lat: 2.9270, lon: -75.2818, radius: 20 },
                    { name: 'Santa Marta', lat: 11.2404, lon: -74.2110, radius: 20 },
                    { name: 'Armenia', lat: 4.5343, lon: -75.6814, radius: 20 },
                    { name: 'Popayán', lat: 2.4414, lon: -76.6060, radius: 20 },
                    { name: 'Montería', lat: 8.7493, lon: -75.8859, radius: 20 },
                    { name: 'Quibdó', lat: 5.6900, lon: -76.6600, radius: 15 }
                ];
                let closest = null, closestDist = Infinity;
                for (const city of cities) {
                    const dist = this.getDistance(lat, lon, city.lat, city.lon);
                    if (dist < city.radius && dist < closestDist) {
                        closest = city.name;
                        closestDist = dist;
                    }
                }

        class OfflineManager {
            constructor() {
                this.dbName = 'MapaVivoDB';
                this.dbVersion = 5;
                this.db = null;
                this.isReady = false;
            }

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.dbVersion);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        // Eliminar stores antiguos y recrearlos con keyPath 'temp_id'
                        if (db.objectStoreNames.contains('reports')) db.deleteObjectStore('reports');
                        if (db.objectStoreNames.contains('pending')) db.deleteObjectStore('pending');
                        if (db.objectStoreNames.contains('sync_queue')) db.deleteObjectStore('sync_queue');
                        if (db.objectStoreNames.contains('images')) db.deleteObjectStore('images');
                        const reportsStore = db.createObjectStore('reports', { keyPath: 'temp_id' });
                        reportsStore.createIndex('temp_id', 'temp_id', { unique: true });
                        db.createObjectStore('pending', { keyPath: 'temp_id' });
                        const syncQueueStore = db.createObjectStore('sync_queue', { keyPath: 'id', autoIncrement: true });
                        syncQueueStore.createIndex('temp_id', 'temp_id');
                        db.createObjectStore('images', { keyPath: 'id' });
                    };
                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        this.isReady = true;
                        this.updatePendingCount();
                        resolve();
                    };
                    request.onerror = () => reject(request.error);
                });
            }

            async saveReport(report) {
                if (!this.isReady) await this.init();
                if (!report.temp_id) {
                    report.temp_id = `MV-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).substr(2,4).toUpperCase()}`;
                }
                const reportData = { ...report, temp_id: report.temp_id, synced: false, savedAt: Date.now() };
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(['reports', 'pending', 'sync_queue'], 'readwrite');
                    const reportsStore = tx.objectStore('reports');
                    const pendingStore = tx.objectStore('pending');
                    const syncQueueStore = tx.objectStore('sync_queue');
                    try {
                        reportsStore.put(reportData);
                        pendingStore.put({ temp_id: reportData.temp_id, data: reportData });
                        syncQueueStore.add({
                            temp_id: reportData.temp_id,
                            operation: 'INSERT',
                            data: report,
                            status: 'pending',
                            created_at: Date.now(),
                            retry_count: 0
                        });
                    } catch (error) {
                        console.error('Error en transacción IndexedDB:', error);
                        reject(new Error('No se pudo guardar localmente'));
                        return;
                    }
                    tx.oncomplete = () => {
                        this.updatePendingCount();
                        resolve(reportData);
                    };
                    tx.onerror = (event) => {
                        console.error('Error en transacción:', event.target.error);
                        reject(new Error('No se pudo guardar localmente'));
                    };
                });
            }

            async getPending() {
                if (!this.isReady) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(['pending'], 'readonly');
                    const request = tx.objectStore('pending').getAll();
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = () => reject(request.error);
                });
            }

            async getPendingCount() {
                const pending = await this.getPending();
                return pending.length;
            }

            async markSynced(tempId) {
    if (!this.isReady) await this.init();
    return new Promise((resolve, reject) => {
        const tx = this.db.transaction(['pending', 'sync_queue', 'reports'], 'readwrite');
        tx.objectStore('pending').delete(tempId);
        tx.objectStore('reports').delete(tempId); // <--- ELIMINA TAMBIÉN DEL STORE REPORTS
        const index = tx.objectStore('sync_queue').index('temp_id');
        const request = index.getAll(tempId);
        request.onsuccess = () => {
            for (const item of request.result) {
                if (item.status === 'pending') {
                    const updatedItem = { ...item, status: 'completed', completed_at: Date.now() };
                    tx.objectStore('sync_queue').put(updatedItem);
                }
            }
        };
        tx.oncomplete = () => {
            this.updatePendingCount();
            resolve(true);
        };
        tx.onerror = () => reject(tx.error);
    });
}

            async markSyncError(tempId, errorMessage) {
                if (!this.isReady) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(['sync_queue'], 'readwrite');
                    const index = tx.objectStore('sync_queue').index('temp_id');
                    const request = index.getAll(tempId);
                    request.onsuccess = () => {
                        for (const item of request.result) {
                            if (item.status === 'pending') {
                                tx.objectStore('sync_queue').put({
                                    ...item,
                                    status: 'error',
                                    error_message: errorMessage,
                                    retry_count: (item.retry_count || 0) + 1
                                });
                            }
                        }
                    };
                    tx.oncomplete = () => {
                        this.updatePendingCount();
                        resolve(true);
                    };
                    tx.onerror = () => reject(tx.error);
                });
            }

            async getAllReports() {
                if (!this.isReady) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(['reports'], 'readonly');
                    const request = tx.objectStore('reports').getAll();
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = () => reject(request.error);
                });
            }

            async updatePendingCount() {
                const count = await this.getPendingCount();
                document.getElementById('statPending').textContent = count;
                if (reports && reports.showPendingStatus) {
                    reports.showPendingStatus(count);
                }
            }
        }

        const offline = new OfflineManager();
        offline.init();

class MapManager {
    constructor() {
        this.map = null;
        this.isReady = false;
        this.reports = [];
        this._clusterClickHandler = null;
        this._reportClickHandler = null;
    }

    init(containerId = 'map') {
        if (this.map) return;

        this.map = new maplibregl.Map({
            container: containerId,
            style: CONFIG.mapStyle,
            center: CONFIG.mapCenter,
            zoom: CONFIG.mapZoom,
            maxZoom: 18,
            minZoom: 4
        });

        this.map.addControl(
            new maplibregl.NavigationControl({ showCompass: false }),
            'top-right'
        );

        // ✅ AJUSTE 2: Al cargar el mapa, si ya hay reportes, los dibuja
        this.map.on('load', () => {
            this.isReady = true;
            console.log('✅ Mapa listo');

            if (this.reports && this.reports.length > 0) {
                this.updateClusters(this.reports);
            }
        });

        return this.map;
    }

    // ============================================================
    // updateClusters() – versión definitiva con todos los ajustes
    // ============================================================
    updateClusters(reports) {
        if (!this.map || !this.isReady) return;

        this.reports = Array.isArray(reports) ? reports : [];

        // 1. Limpiar capas y fuente anteriores
        const layersToRemove = ['cluster-count', 'clusters', 'unclustered-point'];
        for (const layerId of layersToRemove) {
            if (this.map.getLayer(layerId)) {
                this.map.removeLayer(layerId);
            }
        }
        if (this.map.getSource('reports-cluster')) {
            this.map.removeSource('reports-cluster');
        }

        // 2. Crear GeoJSON
        const features = this.reports
            .filter(report => {
                const lat = Number(report.latitude);
                const lon = Number(report.longitude);
                return (
                    Number.isFinite(lat) &&
                    Number.isFinite(lon) &&
                    lat >= -90 && lat <= 90 &&
                    lon >= -180 && lon <= 180
                );
            })
            .map(report => ({
                type: 'Feature',
                geometry: {
                    type: 'Point',
                    coordinates: [Number(report.longitude), Number(report.latitude)]
                },
                properties: {
                    id: report.id || report.temp_id || '',
                    type: report.type || 'report',
                    description: report.description || report.type || 'Reporte'
                }
            }));

        if (features.length === 0) return;

        // 3. Fuente GeoJSON con clusters
        this.map.addSource('reports-cluster', {
            type: 'geojson',
            data: { type: 'FeatureCollection', features: features },
            cluster: true,
            clusterMaxZoom: 14,
            clusterRadius: 50
        });

        // 4. Capa de clusters
        this.map.addLayer({
            id: 'clusters',
            type: 'circle',
            source: 'reports-cluster',
            filter: ['has', 'point_count'],
            paint: {
                'circle-color': [
                    'step',
                    ['get', 'point_count'],
                    '#51bbd6',
                    10,
                    '#f1f075',
                    30,
                    '#f28cb1'
                ],
                'circle-radius': [
                    'step',
                    ['get', 'point_count'],
                    20,
                    10,
                    30,
                    30,
                    40
                ],
                'circle-stroke-width': 2,
                'circle-stroke-color': '#ffffff'
            }
        });

        // 5. Contador en clusters
        this.map.addLayer({
            id: 'cluster-count',
            type: 'symbol',
            source: 'reports-cluster',
            filter: ['has', 'point_count'],
            layout: {
                'text-field': ['get', 'point_count_abbreviated'],
                'text-size': 12
            },
            paint: {
                'text-color': '#ffffff'
            }
        });

        // 6. Puntos individuales (NO agrupados) – ESTA CAPA ESTABA FALTANDO
        this.map.addLayer({
            id: 'unclustered-point',
            type: 'circle',
            source: 'reports-cluster',
            filter: ['!', ['has', 'point_count']],
            paint: {
                'circle-color': [
                    'match',
                    ['get', 'type'],
                    'safe', '#2ecc71',
                    'help', '#e74c3c',
                    'damage', '#f39c12',
                    'road', '#3498db',
                    'resource', '#1a3c6e',
                    '#7f8c8d'
                ],
                'circle-radius': 9,
                'circle-stroke-width': 2,
                'circle-stroke-color': '#ffffff'
            }
        });

        // 7. Listener de clic en clusters (solo se registra una vez)
        if (!this._clusterClickHandler) {
            this._clusterClickHandler = (e) => {
                const features = this.map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
                if (!features.length) return;
                const clusterId = features[0].properties.cluster_id;
                const source = this.map.getSource('reports-cluster');
                if (!source) return;
                source.getClusterExpansionZoom(clusterId, (err, zoom) => {
                    if (err) return;
                    this.map.easeTo({
                        center: features[0].geometry.coordinates,
                        zoom: zoom
                    });
                });
            };
            this.map.on('click', 'clusters', this._clusterClickHandler);
        }

        // 8. Listener de clic en puntos individuales – ✅ AJUSTE 1: solo capa unclustered-point
        if (!this._reportClickHandler) {
            this._reportClickHandler = (e) => {
                const features = this.map.queryRenderedFeatures(e.point, {
                    layers: ['unclustered-point']
                });

                if (!features.length) return;

                const reportFeature = features[0];
                const reportId = reportFeature.properties.id;
                if (!reportId) return;

                const report = this.reports.find(r =>
                    r.id === reportId || r.temp_id === reportId
                );

                if (!report) return;

                const lat = Number(report.latitude);
                const lon = Number(report.longitude);
                if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

                new maplibregl.Popup({ offset: 25 })
                    .setLngLat([lon, lat])
                    .setHTML(`
                        <div style="font-size:0.8rem;padding:4px;max-width:220px;">
                            <strong>${report.description || report.type || 'Reporte'}</strong>
                            <br>
                            <span style="font-size:0.65rem;color:#666;">
                                ${report.created_at ? new Date(report.created_at).toLocaleTimeString() : ''}
                            </span>
                            <br>
                            <span style="font-size:0.65rem;">
                                ✅ ${report.verification_count || 0} confirmaciones
                            </span>
                            <br>
                            <button onclick="corroborateReport('${reportId}')"
                                style="margin-top:4px;padding:4px 8px;background:#2ecc71;border:none;border-radius:4px;color:white;cursor:pointer;font-size:0.7rem;">
                                👍 Corroborar
                            </button>
                        </div>
                    `)
                    .addTo(this.map);
            };
            this.map.on('click', this._reportClickHandler);
        }
    }

class ReportManager {

            showPendingStatus(count) {
                const syncStatus = document.getElementById('syncStatus');
                if (!navigator.onLine) {
                    syncStatus.textContent = '📡 Offline';
                    syncStatus.className = 'sync-status offline';
                } else if (count > 0) {
                    syncStatus.textContent = `⏳ ${count} pendiente${count > 1 ? 's' : ''}`;
                    syncStatus.className = 'sync-status pending';
                } else {
                    syncStatus.textContent = '✅ Sincronizado';
                    syncStatus.className = 'sync-status synced';
                }
            }

            async createReport(data) {
                if (!this.authReady || !this.userId) {
                    showToast('⏳ Esperando autenticación...', 'warning');
                    return null;
                }

                const now = Date.now();
                if (now - this.lastReportTime < 30000) {
                    showToast('Espera unos segundos antes de enviar otro reporte', 'warning');
                    return null;
                }
                this.lastReportTime = now;

                const tempId = `${CONFIG.appPrefix}-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).substr(2,4).toUpperCase()}`;

                const report = {
                    temp_id: tempId,
                    ...data,
                    user_id: this.userId,
                    created_at: new Date(now).toISOString(),
                    updated_at: new Date(now).toISOString(),
                    status: 'active',
                    confidence: 'reported',
                    verification_count: 0,
                    is_public: true
                };

                // 1. SIEMPRE guardar localmente primero
                try {
                    await offline.saveReport(report);
                } catch (error) {
                    showToast('⚠️ No se pudo guardar el reporte localmente. Intenta nuevamente.', 'error');
                    console.error(error);
                    return null;
                }
                let pendingCount = await offline.getPendingCount();
                this.showPendingStatus(pendingCount);

                // 2. Si hay conexión, intentar enviar a Supabase
                if (navigator.onLine) {
                    try {
                        const { temp_id, _key, synced, savedAt, ...serverReport } = report;
                        const { data: inserted, error } = await supabaseClient
                            .from('reports')
                            .insert([serverReport])
                            .select();

                        if (error) {
                            // Cualquier error -> guardar pendiente (más seguro para emergencia)
                            showToast('⏳ Error temporal. Reporte pendiente de envío.', 'warning');
                            showConfirmation(report, false, 'pending');
                            return report;
                        }

                        if (inserted && inserted.length > 0) {
                            const serverReport = inserted[0];
                            await offline.markSynced(tempId);
                            report.id = serverReport.id;
                            showToast('✅ Reporte enviado y compartido', 'success');
                            showConfirmation(serverReport, true, 'success');
                            this.reports.push(serverReport);
                            this.updateStats();
                            mapManager.updateClusters(this.reports);
                            return serverReport;
                        }
                    } catch (error) {
                        console.error('Error en createReport:', error);
                        showToast('⏳ Error inesperado. Reporte pendiente de envío.', 'warning');
                        showConfirmation(report, false, 'pending');
                        return report;
                    }
                } else {
                    showToast('📡 Sin conexión. Reporte guardado localmente.', 'warning');
                    showConfirmation(report, false, 'pending');
                    return report;
                }
            }

            async syncPendingReports() {
                if (this.isSyncing) return;
                if (!navigator.onLine) {
                    await offline.updatePendingCount();
                    return;
                }
                if (!this.authReady || !this.userId) {
                    console.log('⏳ Esperando autenticación para sincronizar...');
                    return;
                }

                this.isSyncing = true;
                let synced = 0, errors = 0;

                try {
                    const pending = await offline.getPending();
                    if (pending.length === 0) {
                        this.isSyncing = false;
                        await offline.updatePendingCount();
                        return;
                    }

                    showToast(`🔄 Sincronizando ${pending.length} reportes...`, 'info');

                    for (const pendingItem of pending) {
                        const reportData = pendingItem.data || pendingItem;
                        const tempId = pendingItem.temp_id || reportData.temp_id;

                        // Verificar si ya existe en Supabase por temp_id
                        const { data: existing } = await supabaseClient
                            .from('reports')
                            .select('id')
                            .eq('temp_id', tempId)
                            .maybeSingle();

                        if (existing) {
                            await offline.markSynced(tempId);
                            synced++;
                            continue;
                        }

                        // Extraer solo los campos válidos para Supabase
                        const { temp_id, _key, synced, savedAt, ...serverReport } = reportData;

                        const { data: inserted, error } = await supabaseClient
                            .from('reports')
                            .insert([serverReport])
                            .select();

                        if (error) {
                            await offline.markSyncError(tempId, 'Temporal: ' + error.message);
                            errors++;
                            continue;
                        }

                        if (inserted && inserted.length > 0) {
                            await offline.markSynced(tempId);
                            synced++;
                        }
                    }

                    if (synced > 0) {
                        showToast(`✅ ${synced} reporte${synced > 1 ? 's' : ''} sincronizado${synced > 1 ? 's' : ''}`, 'success');
                    }
                    if (errors > 0) {
                        showToast(`⚠️ ${errors} reporte${errors > 1 ? 's' : ''} con error`, 'warning');
                    }

                    await offline.updatePendingCount();
                    this.loadReports();
                } catch (error) {
                    console.error('Error en sincronización:', error);
                } finally {
                    this.isSyncing = false;
                }
            }

         async loadReports() {
    // Declarar localReports al inicio para que esté disponible en todo el ámbito

    try {

    } catch (e) {
        console.warn('Error obteniendo reportes locales:', e);

    // Si no autenticado, mostrar solo los reportes locales

        console.log('⏳ No autenticado, mostrando reportes locales...');
        this.reports = localReports;
        mapManager.updateClusters(localReports);
        this.updateStats();
        return this.reports;
    }

    // Cargar desde servidor
    let serverReports = [];
    try {
        const { data, error } = await supabaseClient
            .from('reports')
            .select('*')
            .eq('status', 'active')
            .order('created_at', { ascending: false })
            .limit(200);

        if (!error && data) {
            serverReports = data;
        }
    } catch (error) {
        console.warn('Error cargando desde Supabase:', error);
    }

    // Deduplicar: evitar duplicados locales que ya están en el servidor
    const serverIds = new Set(serverReports.map(r => r.id));
    const serverTempIds = new Set(serverReports.map(r => r.temp_id).filter(Boolean));

    const allReports = [...serverReports];

    for (const local of localReports) {
        if (serverIds.has(local.id) || serverTempIds.has(local.temp_id)) {
            continue;
        }
        allReports.push(local);
    }

    this.reports = allReports;
    mapManager.updateClusters(allReports);
    await offline.updatePendingCount();
    this.updateStats();
    return this.reports;
}

                // ============================================================
        // NUEVO: SUSCRIPCIÓN A REALTIME
        // ============================================================
        subscribeToRealtime() {
            if (!this.authReady || !this.userId) {
                console.warn('⏳ No autenticado, no se puede suscribir a Realtime');
                return;
            }
            if (this.realtimeChannel) {
                console.log('ℹ️ Realtime ya suscrito');
                return;
            }

            console.log('📡 Suscribiendo a Realtime...');
            this.realtimeChannel = supabaseClient
                .channel('reports-realtime')
                .on(
                    'postgres_changes',
                    {
                        event: '*',
                        schema: 'public',
                        table: 'reports'
                    },
                    (payload) => {
                        this.handleRealtimeEvent(payload);
                    }
                )
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        console.log('✅ Realtime conectado');
                    } else if (status === 'CHANNEL_ERROR') {
                        console.warn('⚠️ Error en Realtime, reintentando en 5s...');
                        setTimeout(() => {
                            if (this.realtimeChannel) {
                                this.realtimeChannel.unsubscribe();
                                this.realtimeChannel = null;
                                this.subscribeToRealtime();
                            }
                        }, 5000);
                    }
                });
        }

        // ============================================================
        // NUEVO: MANEJADOR DE EVENTOS REALTIME
        // ============================================================
        handleRealtimeEvent(payload) {
            const { eventType, new: newRecord, old: oldRecord } = payload;

            if (!this.authReady) return;

            try {
                if (eventType === 'INSERT') {
                    if (!this.reports.some(r => r.id === newRecord.id)) {
                        this.reports.push(newRecord);
                        this.updateStats();
                        if (mapManager && typeof mapManager.updateClusters === 'function') {
                            mapManager.updateClusters(this.reports);
                        }
                    }
                } else if (eventType === 'UPDATE') {
                    const index = this.reports.findIndex(r => r.id === newRecord.id);
                    if (index !== -1) {
                        this.reports[index] = { ...this.reports[index], ...newRecord };
                        this.updateStats();
                        if (mapManager && typeof mapManager.updateClusters === 'function') {
                            mapManager.updateClusters(this.reports);
                        }
                    }
                } else if (eventType === 'DELETE') {
                    this.reports = this.reports.filter(r => r.id !== oldRecord.id);
                    this.updateStats();
                    if (mapManager && typeof mapManager.updateClusters === 'function') {
                        mapManager.updateClusters(this.reports);
                    }
                }
            } catch (error) {
                console.error('❌ Error procesando evento Realtime:', error);
            }
        }
        }

        async function fetchEarthquakes() {
            try {
                const response = await fetch('https://qytywodntuikvotimpzs.supabase.co/functions/v1/earthquakes');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const events = Array.isArray(data) ? data : (data.features || []);
                if (events.length === 0) {
                    document.getElementById('statEarthquakes').textContent = '0';
                    return [];
                }
                document.getElementById('statEarthquakes').textContent = events.length;
                for (const eq of events) {
                    const lat = eq.latitud || eq.lat || eq.geometry?.coordinates?.[1];
                    const lon = eq.longitud || eq.lon || eq.geometry?.coordinates?.[0];
                    if (lat && lon && mapManager.isReady && mapManager.map) {
                        const el = document.createElement('div');
                        el.innerHTML = '🌊';
                        el.style.cssText = 'font-size:20px;text-shadow:0 0 5px white;';
                        new maplibregl.Marker({ element: el })
                            .setLngLat([lon, lat])
                            .addTo(mapManager.map);
                    }
                }
                return events;
            } catch (error) {
                console.warn('⚠️ SGC no disponible:', error.message);
                document.getElementById('statEarthquakes').textContent = '⚠️';
                return [];
            }
        }

        // ============================================================
        async function uploadImage(file, reportId) {
            if (!reports.authReady || !reports.userId) {
                showToast('⏳ Esperando autenticación...', 'warning');
                return null;
            }
            try {
                if (!file || !reportId) return null;
                const compressed = await compressImage(file, 800, 0.7);
                const fileName = `${reports.userId}/${reportId}_${Date.now()}.webp`;
                const { error } = await supabaseClient.storage
                    .from('report-images')
                    .upload(fileName, compressed, { contentType: 'image/webp', cacheControl: '3600' });
                if (error) {
                    console.warn('Error subiendo imagen:', error);
                    return null;
                }
                const { data: urlData } = supabaseClient.storage
                    .from('report-images')
                    .getPublicUrl(fileName);
                return urlData?.publicUrl || null;
            } catch (error) {
                console.error('Error en uploadImage:', error);
                return null;
            }
        }

        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (width > maxWidth) {
                            height = (maxWidth / width) * height;
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            if (blob) resolve(blob);
                            else reject(new Error('Error comprimiendo imagen'));
                        }, 'image/webp', quality);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
            });
        }

            document.getElementById('roadBtn').addEventListener('click', showRoadModal);
            document.getElementById('resourcesBtn').addEventListener('click', showResourcesModal);

            document.getElementById('myLocationBtn').addEventListener('click', () => mapManager.centerOnUser());
            document.getElementById('zoomInBtn').addEventListener('click', () => { if (mapManager.map) mapManager.map.zoomIn(); });
            document.getElementById('zoomOutBtn').addEventListener('click', () => { if (mapManager.map) mapManager.map.zoomOut(); });

            document.getElementById('statsToggle').addEventListener('click', () => {
                document.getElementById('statsContent').classList.toggle('hidden');
            });

            document.getElementById('emergencyModeBtn').addEventListener('click', () => {
                document.getElementById('app').classList.toggle('emergency-mode');
                showToast(
                    document.getElementById('app').classList.contains('emergency-mode') ?
                    '🚨 MODO EMERGENCIA' : 'Modo normal',
                    'info'
                );
            });

            document.getElementById('lowDataBtn').addEventListener('click', () => {
                document.getElementById('app').classList.toggle('low-data-mode');
                showToast(
                    document.getElementById('app').classList.contains('low-data-mode') ?
                    '📶 BAJO CONSUMO' : 'Modo normal',
                    'info'
                );
            });

            window.addEventListener('online', async () => {
                document.getElementById('connectionStatus').className = 'connection-status online';
                document.getElementById('connectionStatus').querySelector('.status-text').textContent = 'Conectado';
                document.getElementById('offline-indicator').classList.add('hidden');
                const pending = await offline.getPendingCount();
                if (pending > 0) {
                    showToast(`📡 Sincronizando ${pending} reportes pendientes...`, 'info');
                }
                reports.syncPendingReports();
                if (!reports.realtimeChannel) {
    reports.subscribeToRealtime();
}
            });

            window.addEventListener('offline', () => {
                document.getElementById('connectionStatus').className = 'connection-status offline';
                document.getElementById('connectionStatus').querySelector('.status-text').textContent = 'Sin conexión';
                document.getElementById('offline-indicator').classList.remove('hidden');
                offline.updatePendingCount();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === '1') document.getElementById('safeBtn').click();
                if (e.key === '2') document.getElementById('helpBtn').click();
                if (e.key === '3') document.getElementById('damageBtn').click();
                if (e.key === '4') document.getElementById('roadBtn').click();
                if (e.key === '5') document.getElementById('resourcesBtn').click();
            });

            setInterval(() => {
                if (navigator.onLine && reports.authReady) {
                    reports.syncPendingReports();
                }
            }, 30000);

            console.log('✅ Aplicación lista');
            console.log('👤 Usuario autenticado:', reports.authReady);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
